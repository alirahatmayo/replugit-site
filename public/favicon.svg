<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Replugit mark, redrawn from the logo: open ring, plug at the right, cable leaving through the lower-left break. -->
  <rect width="100" height="100" rx="22" fill="#0F172A"/>
  <path d="M 69.0 70.7 A 31 31 0 0 1 24.1 71.9" stroke="#10B981" stroke-width="9.5" stroke-linecap="round"/>
  <path d="M 15.5 55.4 A 31 31 0 0 1 69.0 29.3" stroke="#10B981" stroke-width="9.5" stroke-linecap="round"/>
  <!-- Cable: out of the plug, sweeping down and left through the gap -->
  <path d="M 56 58 C 42 58 30 60 13 68" stroke="#10B981" stroke-width="7" stroke-linecap="round"/>
  <!-- Plug body: rounded on the left like the logo -->
  <path d="M 78 37 H 63 A 13 13 0 0 0 63 63 H 78 A 4 4 0 0 0 82 59 V 41 A 4 4 0 0 0 78 37 Z" fill="#10B981"/>
  <!-- Prongs -->
  <rect x="80" y="41" width="13" height="5.5" rx="2.75" fill="#10B981"/>
  <rect x="80" y="53.5" width="13" height="5.5" rx="2.75" fill="#10B981"/>
</svg>
